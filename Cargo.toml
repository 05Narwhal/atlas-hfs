[package]
name = "atlas-hfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Read classic HFS (Mac OS Standard) volumes: master directory block, catalog and extents B-trees, forks, Mac text encodings."
repository = "https://github.com/05Narwhal/atlas-hfs"
homepage = "https://julianloy.com"
readme = "README.md"
keywords = ["hfs", "filesystem", "macos", "classic", "parser"]
categories = ["filesystem", "parser-implementations"]
authors = ["Julian A. Loy"]

[features]
# Test volume builders and byte-level fixtures, for crates that test against this one.
test-util = ["atlas-hfsplus/test-util"]

[dependencies]
atlas-fs-core = { version = "0.1", path = "X:/Documents/Coding/Projects/Libraries/Rust/atlas-fs-core" }
# The shared B-tree, fork map and catalog helpers.
atlas-hfsplus = { version = "0.1", path = "X:/Documents/Coding/Projects/Libraries/Rust/atlas-hfsplus" }

[dev-dependencies]
# The B-tree node fixtures the tests build on.
atlas-hfsplus = { version = "0.1", path = "X:/Documents/Coding/Projects/Libraries/Rust/atlas-hfsplus", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "deny"
